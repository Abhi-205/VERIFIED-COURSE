<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verified Course Material</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Verified Course Material</h1>
    <p>Learn Better. Learn from Verified Resources.</p>
  </header>

  <nav>
    <button onclick="showSection('home')">Home</button>
    <button onclick="showSection('browse')">Browse Notes</button>
    <button onclick="showSection('upload')">Upload Material</button>
  </nav>

  <main>
    <section id="home" class="section">
      <h2>Welcome to Verified Course Material</h2>
      <p>Find notes and study material for your subjects.</p>

      <input id="homeSubject" placeholder="Enter subject name">
      <button onclick="searchFromHome()">Search Material</button>
    </section>

    <section id="browse" class="section hidden">
      <h2>Browse Course Material</h2>

      <input id="searchInput" placeholder="Search subject or topic"
        oninput="displayMaterials()">

      <div id="materialList"></div>
    </section>

    <section id="upload" class="section hidden">
      <h2>Upload Course Material</h2>

      <input id="teacherName" placeholder="Teacher name">
      <input id="subject" placeholder="Subject name">
      <input id="topic" placeholder="Topic name">
      <input id="course" placeholder="Course / Branch">
      <input id="materialLink" placeholder="Material link (optional)">

      <textarea id="description"
        placeholder="Material description"></textarea>

      <button onclick="addMaterial()">Submit Material</button>

      <p id="message"></p>
    </section>
  </main>

  <footer>
    <p>Verified Course Material Project | 2026</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
